<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kajero | Secure Login</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>

<style>
body { font-family: 'Inter', sans-serif; }
</style>

</head>

<body class="min-h-screen bg-[#020617] text-white overflow-hidden relative">

<div class="absolute inset-0 -z-10 overflow-hidden">
<div class="absolute top-[-180px] left-[-180px] w-[500px] h-[500px] bg-blue-600/30 rounded-full blur-3xl animate-pulse"></div>
<div class="absolute bottom-[-180px] right-[-180px] w-[500px] h-[500px] bg-cyan-500/30 rounded-full blur-3xl animate-pulse"></div>
<div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(255,255,255,0.05)_1px,transparent_1px)] bg-[size:25px_25px]"></div>
</div>

<div class="min-h-screen flex items-center justify-center px-5 py-10">

<div class="w-full max-w-7xl grid lg:grid-cols-2 bg-white/5 border border-white/10 backdrop-blur-3xl rounded-[40px] overflow-hidden shadow-[0_20px_80px_rgba(0,0,0,0.45)]">

<!-- PANEL IZQUIERDO -->
<div class="hidden lg:flex flex-col justify-between p-14 bg-gradient-to-br from-blue-600/20 to-cyan-500/10 border-r border-white/10">

<div>
<h1 class="text-5xl font-black">Kajero</h1>
<p class="text-slate-300 mt-2">Neo Digital Banking</p>

<h2 class="text-5xl font-black mt-20 leading-tight">
La nueva banca inteligente
</h2>

<p class="text-slate-300 mt-8">
Sistema conectado a Supabase con usuarios reales, saldo dinámico y transferencias.
</p>
</div>

</div>

<!-- LOGIN -->
<div class="p-8 md:p-14 flex items-center justify-center">

<div class="w-full max-w-md">

<p class="uppercase tracking-[5px] text-cyan-400 font-bold text-sm">
Secure Access
</p>

<h2 class="text-4xl font-black mt-5">
Accede a tu cuenta
</h2>

<p class="text-slate-400 mt-5">
Ingresa tus credenciales para continuar
</p>

<div class="mt-10 space-y-5">

<div class="relative">
<i class="fa-solid fa-user absolute left-5 top-1/2 -translate-y-1/2 text-slate-500"></i>
<input id="cuenta" type="text"
placeholder="Número de cuenta"
class="w-full bg-slate-900/80 border border-white/10 rounded-3xl py-5 pl-14 pr-5 text-white outline-none focus:border-blue-500"/>
</div>

<div class="relative">
<i class="fa-solid fa-lock absolute left-5 top-1/2 -translate-y-1/2 text-slate-500"></i>
<input id="pin" type="password"
placeholder="PIN de seguridad"
class="w-full bg-slate-900/80 border border-white/10 rounded-3xl py-5 pl-14 pr-5 text-white outline-none focus:border-cyan-500"/>
</div>

<button id="btnLogin"
class="w-full bg-gradient-to-r from-blue-600 to-cyan-500 rounded-3xl py-5 font-black text-lg">
Ingresar
</button>

<p id="mensaje" class="text-center mt-4 text-red-400 font-semibold"></p>

</div>

</div>

</div>

</div>

</div>

<script src="app.js"></script>

</body>
</html>
