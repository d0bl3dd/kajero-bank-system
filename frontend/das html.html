<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Kajero</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen p-8">

  <div class="max-w-5xl mx-auto">

    <div class="flex justify-between items-center mb-10">
      <h1 class="text-4xl font-bold">Dashboard</h1>

      <button
        id="logoutBtn"
        class="bg-red-500 px-5 py-2 rounded-xl"
      >
        Cerrar sesión
      </button>
    </div>

    <div class="bg-zinc-900 rounded-2xl p-8 shadow-xl">

      <p class="text-zinc-400 mb-2">Saldo actual</p>

      <h2 id="saldo" class="text-5xl font-bold text-emerald-400">
        $0
      </h2>

    </div>

  </div>

  <script type="module" src="js/dashboard.js"></script>

</body>
</html>
