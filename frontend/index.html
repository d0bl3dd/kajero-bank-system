<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kajero Bank</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-black text-white min-h-screen flex items-center justify-center">

  <div class="w-full max-w-md bg-zinc-900 p-8 rounded-2xl shadow-2xl">

    <h1 class="text-4xl font-bold mb-2 text-center">
      Kajero
    </h1>

    <p class="text-zinc-400 text-center mb-6">
      Sistema Bancario Seguro
    </p>

    <form id="loginForm" class="space-y-4">

      <input
        type="email"
        id="email"
        placeholder="Correo electrónico"
        class="w-full p-3 rounded-xl bg-zinc-800 border border-zinc-700"
      >

      <input
        type="password"
        id="password"
        placeholder="Contraseña"
        class="w-full p-3 rounded-xl bg-zinc-800 border border-zinc-700"
      >

      <button
        type="submit"
        class="w-full bg-emerald-500 hover:bg-emerald-600 transition p-3 rounded-xl font-semibold"
      >
        Iniciar Sesión
      </button>

    </form>

    <button
      id="registerBtn"
      class="w-full mt-4 border border-zinc-700 p-3 rounded-xl hover:bg-zinc-800 transition"
    >
      Crear Cuenta
    </button>

  </div>

  <script type="module" src="js/auth.js"></script>

</body>
</html>
