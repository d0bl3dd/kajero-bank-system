<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Kajero Bank</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="bg-black text-white min-h-screen flex items-center justify-center p-6">

  <div class="w-full max-w-md bg-zinc-900 border border-zinc-800 p-8 rounded-3xl shadow-2xl">

    <!-- LOGO -->
    <div class="text-center mb-8">

      <h1 class="text-5xl font-black tracking-tight text-emerald-400">
        Kajero
      </h1>

      <p class="text-zinc-400 mt-2">
        Sistema Bancario Seguro
      </p>

    </div>

    <!-- FORM -->
    <form id="loginForm" class="space-y-5">

      <div>
        <label class="block mb-2 text-sm text-zinc-400">
          Correo electrónico
        </label>

        <input
          type="email"
          id="email"
          placeholder="usuario@email.com"
          class="w-full p-4 rounded-2xl bg-zinc-800 border border-zinc-700 outline-none focus:border-emerald-500 transition"
          required
        />
      </div>

      <div>
        <label class="block mb-2 text-sm text-zinc-400">
          Contraseña
        </label>

        <input
          type="password"
          id="password"
          placeholder="********"
          class="w-full p-4 rounded-2xl bg-zinc-800 border border-zinc-700 outline-none focus:border-emerald-500 transition"
          required
        />
      </div>

      <button
        type="submit"
        class="w-full bg-emerald-500 hover:bg-emerald-600 transition p-4 rounded-2xl font-bold text-lg shadow-lg"
      >
        Iniciar Sesión
      </button>

    </form>

    <!-- REGISTER -->
    <button
      id="registerBtn"
      class="w-full mt-5 border border-zinc-700 p-4 rounded-2xl hover:bg-zinc-800 transition font-semibold"
    >
      Crear Cuenta
    </button>

    <!-- FOOTER -->
    <div class="mt-8 pt-6 border-t border-zinc-800 text-center">

      <p class="text-zinc-500 text-sm">
        Kajero Bank © 2026
      </p>

    </div>

  </div>

  <!-- JS MODULE -->
  <script type="module" src="js/auth.js"></script>

</body>

</html>
